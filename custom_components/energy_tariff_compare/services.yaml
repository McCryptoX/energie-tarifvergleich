collect_now:
  name: Jetzt erfassen
  description: Erfasst und berechnet den letzten abgeschlossenen 15-Minuten-Slot sofort und speichert ihn in der SQLite-Projektdatenbank.

shift_month:
  name: Monatsansicht wechseln
  description: Wechselt den angezeigten Monat für die Monats-Auswertung und Sensoren (vor, zurück oder direktes Datum).
  fields:
    delta:
      name: Monats-Verschiebung (Delta)
      description: "Relativer Monatssprung (-1 = vorheriger Monat, +1 = nächster Monat)."
      required: false
      example: -1
      selector:
        number:
          min: -12
          max: 12
          mode: box
    year:
      name: Ziel-Jahr
      description: "Konkretes 4-stelliges Kalenderjahr (z. B. 2026)."
      required: false
      example: 2026
      selector:
        number:
          min: 2026
          max: 2035
    month:
      name: Ziel-Monat
      description: "Konkreter Monatsindex (1 = Januar bis 12 = Dezember)."
      required: false
      example: 8
      selector:
        number:
          min: 1
          max: 12

reload_tariffs:
  name: Tarife neu laden
  description: Lädt Preisstufen, Zeitfenster und Umlagen aus der tariffs.yaml neu ein und berechnet betroffene Intervalle neu (ohne Core-Neustart).


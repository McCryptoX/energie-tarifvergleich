title: Energie & Tarifvergleich
views:
  - title: Übersicht
    path: vergleich
    icon: mdi:scale-balance
    show_icon_and_title: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Seit Messbeginn
            heading_style: title
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_gesamt
            primary: >
              {% set kwh = states('sensor.tarifvergleich_gesamt') %}
              {% if is_number(kwh) %}{{ '%.2f'|format(kwh|float) | replace('.', ',') }} kWh ausgewertet{% else %}Gesamtauswertung wird geladen{% endif %}
            secondary: >
              {% set e = 'sensor.tarifvergleich_gesamt' %}
              {% set start = state_attr(e, 'period_start') %}
              {% set complete = state_attr(e, 'days_complete') %}
              {% set with_data = state_attr(e, 'days_with_data') %}
              {% if start %}seit {{ start[8:10] }}.{{ start[5:7] }}.{{ start[0:4] }}{% else %}seit erstem Messwert{% endif %}
              {% if complete is number and with_data is number %} · {{ complete }} vollständige von {{ with_data }} Tagen{% endif %}
            icon: mdi:calendar-range
            icon_color: teal
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_gesamt
                primary: >
                  {% set v = state_attr('sensor.tarifvergleich_gesamt', 'cost_octopus_heat') %}
                  {% if v is number %}{{ '%.2f'|format(v) | replace('.', ',') }} €{% else %}–{% endif %}
                secondary: Octopus Heat · Vertrag / Referenz
                icon: mdi:file-sign
                icon_color: >
                  {{ 'green' if state_attr('sensor.tarifvergleich_gesamt', 'cheapest') == 'octopus_heat' else 'cyan' }}
                multiline_secondary: true
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_gesamt
                primary: >
                  {% set v = state_attr('sensor.tarifvergleich_gesamt', 'cost_octopus_heat_loyalty') %}
                  {% if v is number %}{{ '%.2f'|format(v) | replace('.', ',') }} €{% else %}–{% endif %}
                secondary: >
                  {% set d = state_attr('sensor.tarifvergleich_gesamt', 'delta_vs_heat_octopus_heat_loyalty') %}
                  Heat Loyalty{% if d is number %} · {{ '%+.2f'|format(d) | replace('.', ',') }} € vs Heat{% endif %}
                icon: mdi:star-outline
                icon_color: >
                  {% set e = 'sensor.tarifvergleich_gesamt' %}{% set d = state_attr(e, 'delta_vs_heat_octopus_heat_loyalty') %}
                  {{ 'green' if state_attr(e, 'cheapest') == 'octopus_heat_loyalty' else 'red' if d is number and d > 0 else 'blue-grey' }}
                multiline_secondary: true
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_gesamt
                primary: >
                  {% set v = state_attr('sensor.tarifvergleich_gesamt', 'cost_fix_tarif') %}
                  {% if v is number %}{{ '%.2f'|format(v) | replace('.', ',') }} €{% else %}–{% endif %}
                secondary: >
                  {% set d = state_attr('sensor.tarifvergleich_gesamt', 'delta_vs_heat_fix_tarif') %}
                  Fixer Tarif{% if d is number %} · {{ '%+.2f'|format(d) | replace('.', ',') }} € vs Heat{% endif %}
                icon: mdi:lock-outline
                icon_color: >
                  {% set e = 'sensor.tarifvergleich_gesamt' %}{% set d = state_attr(e, 'delta_vs_heat_fix_tarif') %}
                  {{ 'green' if state_attr(e, 'cheapest') == 'fix_tarif' else 'red' if d is number and d > 0 else 'blue-grey' }}
                multiline_secondary: true
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_gesamt
                primary: >
                  {% set v = state_attr('sensor.tarifvergleich_gesamt', 'cost_dynamic') %}
                  {% if v is number %}{{ '%.2f'|format(v) | replace('.', ',') }} €{% else %}–{% endif %}
                secondary: >
                  {% set d = state_attr('sensor.tarifvergleich_gesamt', 'delta_vs_heat_dynamic') %}
                  Dynamisch{% if d is number %} · {{ '%+.2f'|format(d) | replace('.', ',') }} € vs Heat{% endif %}
                icon: mdi:chart-timeline-variant
                icon_color: >
                  {% set e = 'sensor.tarifvergleich_gesamt' %}{% set d = state_attr(e, 'delta_vs_heat_dynamic') %}
                  {{ 'green' if state_attr(e, 'cheapest') == 'dynamic' else 'red' if d is number and d > 0 else 'indigo' }}
                multiline_secondary: true
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_gesamt
                primary: >
                  {% set v = state_attr('sensor.tarifvergleich_gesamt', 'cost_dynamic_modul3') %}
                  {% if v is number %}{{ '%.2f'|format(v) | replace('.', ',') }} €{% else %}–{% endif %}
                secondary: >
                  {% set d = state_attr('sensor.tarifvergleich_gesamt', 'delta_vs_heat_dynamic_modul3') %}
                  Dynamisch + Modul 3{% if d is number %} · {{ '%+.2f'|format(d) | replace('.', ',') }} € vs Heat{% endif %}
                icon: mdi:sine-wave
                icon_color: >
                  {% set e = 'sensor.tarifvergleich_gesamt' %}{% set d = state_attr(e, 'delta_vs_heat_dynamic_modul3') %}
                  {{ 'green' if state_attr(e, 'cheapest') == 'dynamic_modul3' else 'red' if d is number and d > 0 else 'purple' }}
                multiline_secondary: true
                tap_action:
                  action: more-info
          - type: heading
            heading: Mathematische Untergrenze
            heading_style: subtitle
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_gesamt
                primary: >
                  {% set v = state_attr('sensor.tarifvergleich_gesamt', 'cost_dynamic_flat_perfect') %}
                  {% if v is number %}{{ '%.2f'|format(v) | replace('.', ',') }} €{% else %}–{% endif %}
                secondary: >
                  {% set e = 'sensor.tarifvergleich_gesamt' %}
                  {% set p = state_attr(e, 'cost_dynamic_flat_perfect') %}
                  {% set s = state_attr(e, 'potential_dynamic_eur') %}
                  {% set d = state_attr(e, 'perfect_days') %}
                  Dynamisch perfekt · Ist gleiche Tage {% if p is number and s is number %}{{ '%.2f'|format(p + s) | replace('.', ',') }} €{% else %}–{% endif %}{% if s is number %} · {{ '%.2f'|format(s) | replace('.', ',') }} € Potenzial{% endif %}{% if d is number %} · {{ d }} Tage{% endif %}
                icon: mdi:shuffle-variant
                icon_color: indigo
                multiline_secondary: true
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_gesamt
                primary: >
                  {% set v = state_attr('sensor.tarifvergleich_gesamt', 'cost_dynamic_perfect') %}
                  {% if v is number %}{{ '%.2f'|format(v) | replace('.', ',') }} €{% else %}–{% endif %}
                secondary: >
                  {% set e = 'sensor.tarifvergleich_gesamt' %}
                  {% set p = state_attr(e, 'cost_dynamic_perfect') %}
                  {% set s = state_attr(e, 'potential_eur') %}
                  {% set d = state_attr(e, 'perfect_days') %}
                  Modul 3 perfekt · Ist gleiche Tage {% if p is number and s is number %}{{ '%.2f'|format(p + s) | replace('.', ',') }} €{% else %}–{% endif %}{% if s is number %} · {{ '%.2f'|format(s) | replace('.', ',') }} € Potenzial{% endif %}{% if d is number %} · {{ d }} Tage{% endif %}
                icon: mdi:shuffle-variant
                icon_color: purple
                multiline_secondary: true
                tap_action:
                  action: more-info
          - type: markdown
            content: >
              „Perfekt“ ist eine theoretische Untergrenze auf denselben vollständigen Tagen
              („Ist gleiche Tage“). Die fünf Tarifkarten oben nutzen alle Messwerte seit Beginn.
              Hauptvergleich bleibt Ihr unverändertes reales Verbrauchsprofil.

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Arbeitspreise jetzt
            heading_style: title
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:file-sign
                icon_color: cyan
                content: >
                  {% set v = states('sensor.tarifvergleich_preis_heat') %}Heat {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }}{% else %}–{% endif %} ct
              - type: template
                icon: mdi:star-outline
                content: >
                  {% set v = states('sensor.tarifvergleich_preis_loyalty') %}Loyalty {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }}{% else %}–{% endif %} ct
              - type: template
                icon: mdi:lock-outline
                content: >
                  {% set v = states('sensor.tarifvergleich_preis_fix') %}Fix {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }}{% else %}–{% endif %} ct
              - type: template
                icon: mdi:chart-timeline-variant
                icon_color: indigo
                content: >
                  {% set v = states('sensor.tarifvergleich_preis_dynamisch') %}Dyn {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }}{% else %}–{% endif %} ct
              - type: template
                icon: mdi:sine-wave
                icon_color: purple
                content: >
                  {% set v = states('sensor.tarifvergleich_preis_modul3') %}M3 {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }}{% else %}–{% endif %} ct

      - type: grid
        cards:
          - type: heading
            heading: Netzbezug · 24 Stunden
            heading_style: title
          - type: custom:mini-graph-card
            name: 15-Minuten-Netzbezug
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            animate: false
            hour24: true
            decimals: 3
            smoothing: false
            color: '#ff9800'
            show:
              labels: true
              extrema: true
              fill: fade
            entities:
              - entity: sensor.tarifvergleich_viertelstunde_kwh
                name: kWh
                color: '#ff9800'

      - type: grid
        cards:
          - type: heading
            heading: Dynamisch / Modul 3 · 24 Stunden
            heading_style: title
          - type: custom:mini-graph-card
            name: Arbeitspreis brutto
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            animate: false
            hour24: true
            decimals: 1
            smoothing: false
            show:
              labels: true
              extrema: true
              fill: fade
              legend: true
            entities:
              - entity: sensor.tarifvergleich_dynamisch_ct
                name: Dynamisch
                color: '#3f51b5'
              - entity: sensor.tarifvergleich_modul3_ct
                name: + Modul 3
                color: '#9c27b0'

      - type: grid
        cards:
          - type: heading
            heading: Heute & Gestern
            heading_style: title
            grid_options:
              columns: full
              rows: auto
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_heute
            grid_options:
              columns: full
              rows: auto
            primary: >
              {% set v = states('sensor.tarifvergleich_heute') %}Heute · {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }} kWh{% else %}–{% endif %}
            secondary: >
              {% set e='sensor.tarifvergleich_heute' %}{% set rows=[('Heat','octopus_heat'),('Loyalty','octopus_heat_loyalty'),('Fix','fix_tarif'),('Dynamisch','dynamic'),('Modul 3','dynamic_modul3')] %}{% set ns=namespace(v=none,n='') %}{% for n,id in rows %}{% set v=state_attr(e,'cost_' ~ id) %}{% if v is number and (ns.v is none or v < ns.v) %}{% set ns.v=v %}{% set ns.n=n %}{% endif %}{% endfor %}
              {% if state_attr(e,'ranking_complete') and ns.v is number %}Günstigster: {{ ns.n }} · {{ '%.2f'|format(ns.v) | replace('.', ',') }} €{% else %}Zwischenstand · Details nach Datenlage{% endif %}
            icon: mdi:calendar-today
            icon_color: amber
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_gestern
            grid_options:
              columns: full
              rows: auto
            primary: >
              {% set v = states('sensor.tarifvergleich_gestern') %}Gestern · {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }} kWh{% else %}–{% endif %}
            secondary: >
              {% set e='sensor.tarifvergleich_gestern' %}{% set rows=[('Heat','octopus_heat'),('Loyalty','octopus_heat_loyalty'),('Fix','fix_tarif'),('Dynamisch','dynamic'),('Modul 3','dynamic_modul3')] %}{% set ns=namespace(v=none,n='') %}{% for n,id in rows %}{% set v=state_attr(e,'cost_' ~ id) %}{% if v is number and (ns.v is none or v < ns.v) %}{% set ns.v=v %}{% set ns.n=n %}{% endif %}{% endfor %}
              {% if state_attr(e,'ranking_complete') and ns.v is number %}Günstigster: {{ ns.n }} · {{ '%.2f'|format(ns.v) | replace('.', ',') }} €{% else %}Keine vollständige Rangfolge{% endif %}
            icon: mdi:calendar-arrow-left
            icon_color: blue-grey
            multiline_secondary: true
            tap_action:
              action: more-info

      - type: grid
        cards:
          - type: heading
            heading: Monat & Jahr
            heading_style: title
            badges:
              - type: button
                icon: mdi:chevron-left
                tap_action:
                  action: perform-action
                  perform_action: energy_tariff_compare.shift_month
                  data:
                    delta: -1
              - type: button
                icon: mdi:calendar-today
                tap_action:
                  action: perform-action
                  perform_action: energy_tariff_compare.shift_month
                  data:
                    delta: 0
              - type: button
                icon: mdi:chevron-right
                tap_action:
                  action: perform-action
                  perform_action: energy_tariff_compare.shift_month
                  data:
                    delta: 1
            grid_options:
              columns: full
              rows: auto
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_monat
            grid_options:
              columns: full
              rows: auto
            primary: >
              {% set v = states('sensor.tarifvergleich_monat') %}Monat {{ state_attr('sensor.tarifvergleich_monat','selected_label') or '–' }} · {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }} kWh{% else %}–{% endif %}
            secondary: >
              {% set e='sensor.tarifvergleich_monat' %}{% set rows=[('Heat','octopus_heat'),('Loyalty','octopus_heat_loyalty'),('Fix','fix_tarif'),('Dynamisch','dynamic'),('Modul 3','dynamic_modul3')] %}{% set ns=namespace(v=none,n='') %}{% for n,id in rows %}{% set v=state_attr(e,'cost_' ~ id) %}{% if v is number and (ns.v is none or v < ns.v) %}{% set ns.v=v %}{% set ns.n=n %}{% endif %}{% endfor %}
              {% if state_attr(e,'ranking_complete') and ns.v is number %}Günstigster: {{ ns.n }} · {{ '%.2f'|format(ns.v) | replace('.', ',') }} €{% else %}Zwischenstand / unvollständiger Monat{% endif %}
            icon: mdi:calendar-month
            icon_color: teal
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_jahr
            grid_options:
              columns: full
              rows: auto
            primary: >
              {% set v = states('sensor.tarifvergleich_jahr') %}{% set y = state_attr('sensor.tarifvergleich_jahr','period_start') %}{{ y[:4] if y else 'Jahr' }} · {% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }} kWh{% else %}–{% endif %}
            secondary: >
              {% set e='sensor.tarifvergleich_jahr' %}{% set rows=[('Heat','octopus_heat'),('Loyalty','octopus_heat_loyalty'),('Fix','fix_tarif'),('Dynamisch','dynamic'),('Modul 3','dynamic_modul3')] %}{% set ns=namespace(v=none,n='') %}{% for n,id in rows %}{% set v=state_attr(e,'cost_' ~ id) %}{% if v is number and (ns.v is none or v < ns.v) %}{% set ns.v=v %}{% set ns.n=n %}{% endif %}{% endfor %}
              {% if state_attr(e,'ranking_complete') and ns.v is number %}Günstigster: {{ ns.n }} · {{ '%.2f'|format(ns.v) | replace('.', ',') }} €{% else %}Zwischenstand / Datenlücke{% endif %}
            icon: mdi:calendar-blank-multiple
            icon_color: blue
            multiline_secondary: true
            tap_action:
              action: more-info

  - title: Verlauf
    path: preise
    icon: mdi:chart-line
    show_icon_and_title: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Dynamisch und Modul 3 heute
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preis_dynamisch
                primary: >
                  {% set v=states('sensor.tarifvergleich_preis_dynamisch') %}{% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }} ct/kWh{% else %}–{% endif %}
                secondary: >
                  {% set e='sensor.tarifvergleich_preise' %}{% set lo=state_attr(e,'today_dynamic_min_ct') %}{% set hi=state_attr(e,'today_dynamic_max_ct') %}
                  Dynamisch · heute {% if lo is number %}{{ '%.1f'|format(lo) | replace('.', ',') }}{% else %}–{% endif %} bis {% if hi is number %}{{ '%.1f'|format(hi) | replace('.', ',') }}{% else %}–{% endif %} ct
                icon: mdi:chart-timeline-variant
                icon_color: indigo
                multiline_secondary: true
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preis_modul3
                primary: >
                  {% set v=states('sensor.tarifvergleich_preis_modul3') %}{% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }} ct/kWh{% else %}–{% endif %}
                secondary: >
                  {% set e='sensor.tarifvergleich_preise' %}{% set lo=state_attr(e,'today_modul3_min_ct') %}{% set hi=state_attr(e,'today_modul3_max_ct') %}
                  Modul 3 · heute {% if lo is number %}{{ '%.1f'|format(lo) | replace('.', ',') }}{% else %}–{% endif %} bis {% if hi is number %}{{ '%.1f'|format(hi) | replace('.', ',') }}{% else %}–{% endif %} ct
                icon: mdi:sine-wave
                icon_color: purple
                multiline_secondary: true
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preise
                primary: >
                  {{ state_attr('sensor.tarifvergleich_preise','heat_span') or 'Nächstes Heat-Niedrigpreisfenster' }}
                secondary: Heat NT · 02–06 und 12–16 Uhr
                icon: mdi:weather-night
                icon_color: cyan
                multiline_secondary: true
                tap_action:
                  action: more-info
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:weather-night
                icon_color: >
                  {{ 'green' if state_attr('sensor.tarifvergleich_preise','modul3_slot') == 'nt' else 'grey' }}
                content: NT 00–07
              - type: template
                icon: mdi:minus
                icon_color: >
                  {{ 'amber' if state_attr('sensor.tarifvergleich_preise','modul3_slot') == 'st' else 'grey' }}
                content: ST 07–15 / 20–24
              - type: template
                icon: mdi:weather-sunny
                icon_color: >
                  {{ 'red' if state_attr('sensor.tarifvergleich_preise','modul3_slot') == 'ht' else 'grey' }}
                content: HT 15–20
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:traffic-light
                icon_color: >
                  {% set p = state_attr('sensor.tarifvergleich_heute', 'hit_share_octopus_heat') %}
                  {{ 'green' if p is number and p >= 0.40 else 'amber' if p is number and p >= 0.25 else 'red' if p is number else 'grey' }}
                content: >
                  {% set p = state_attr('sensor.tarifvergleich_heute', 'hit_share_octopus_heat') %}
                  Heat {% if p is number %}{{ (p * 100) | round(0) | int }} %{% else %}–{% endif %}
              - type: template
                icon: mdi:chart-timeline-variant
                icon_color: >
                  {% set p = state_attr('sensor.tarifvergleich_heute', 'hit_share_dynamic') %}
                  {{ 'green' if p is number and p >= 0.40 else 'amber' if p is number and p >= 0.25 else 'red' if p is number else 'grey' }}
                content: >
                  {% set p = state_attr('sensor.tarifvergleich_heute', 'hit_share_dynamic') %}
                  Dyn {% if p is number %}{{ (p * 100) | round(0) | int }} %{% else %}–{% endif %}
              - type: template
                icon: mdi:sine-wave
                icon_color: >
                  {% set p = state_attr('sensor.tarifvergleich_heute', 'hit_share_dynamic_modul3') %}
                  {{ 'green' if p is number and p >= 0.40 else 'amber' if p is number and p >= 0.25 else 'red' if p is number else 'grey' }}
                content: >
                  {% set p = state_attr('sensor.tarifvergleich_heute', 'hit_share_dynamic_modul3') %}
                  M3 {% if p is number %}{{ (p * 100) | round(0) | int }} %{% else %}–{% endif %}
          - type: markdown
            content: |
              {% set e='sensor.tarifvergleich_preise' %}
              **Günstigste Blöcke · nur Anzeige, keine Steuerung**  
              1 h · Dyn {{ state_attr(e,'run_dynamic_1h') or '–' }} · M3 {{ state_attr(e,'run_modul3_1h') or '–' }}  
              2 h · Dyn {{ state_attr(e,'run_dynamic_2h') or '–' }} · M3 {{ state_attr(e,'run_modul3_2h') or '–' }}  
              3 h · Dyn {{ state_attr(e,'run_dynamic_3h') or '–' }} · M3 {{ state_attr(e,'run_modul3_3h') or '–' }}
          - type: markdown
            content: >
              Ampel = heutiger kWh-Anteil in Heat-NT (02–06 / 12–16) bzw. im günstigsten
              Drittel der Slots. Vergleichsbasis bleibt das unveränderte Heat-Profil.
              Arbeitspreise sind Momentaufnahmen; verbrauchsgewichtete Kosten stehen in
              Übersicht und Details.

      - type: grid
        cards:
          - type: heading
            heading: 7 Tage · Stundenmittel
            heading_style: title
          - type: custom:mini-graph-card
            name: Dynamisch / Modul 3
            hours_to_show: 168
            points_per_hour: 1
            line_width: 2
            animate: false
            hour24: true
            decimals: 1
            smoothing: false
            aggregate_func: avg
            show:
              labels: true
              extrema: true
              fill: fade
              legend: true
            entities:
              - entity: sensor.tarifvergleich_dynamisch_ct
                name: Dynamisch
                color: '#3f51b5'
              - entity: sensor.tarifvergleich_modul3_ct
                name: + Modul 3
                color: '#9c27b0'

      - type: grid
        cards:
          - type: heading
            heading: 31 Tage · Stundenmittel
            heading_style: title
          - type: statistics-graph
            chart_type: line
            period: hour
            days_to_show: 31
            stat_types:
              - mean
            entities:
              - entity: sensor.tarifvergleich_dynamisch_ct
                name: Dynamisch
              - entity: sensor.tarifvergleich_modul3_ct
                name: + Modul 3

      - type: grid
        column_span: 2
        cards:
          - type: heading

              {% set v=states(e) %}**{% if is_number(v) %}{{ '%.2f'|format(v|float) | replace('.', ',') }} kWh{% else %}– kWh{% endif %}** · {{ state_attr(e,'quality') or 'Daten werden geladen' }}

              {% if state_attr(e,'ranking_complete') and ns.v is number %}**Günstigster Ist-Tarif: {{ ns.n }} · {{ '%.2f'|format(ns.v) | replace('.', ',') }} €**{% else %}**Keine belastbare Rangfolge:** Datenbasis ist noch nicht vollständig.{% endif %}

              {% for n,id in rows %}{% set a=state_attr(e,'energy_cost_' ~ id) %}{% set g=state_attr(e,'cost_' ~ id) %}{% if g is number and a is number %}{% set f=g-a %}{% else %}{% set f=state_attr(e,'standing_cost_' ~ id) %}{% if id == 'dynamic_modul3' %}{% set p=state_attr(e,'paragraph_14a_eur') %}{% set f=f+p if f is number and p is number else none %}{% endif %}{% endif %}
              **{{ n }} · {% if g is number %}{{ '%.2f'|format(g) | replace('.', ',') }} €{% else %}–{% endif %}**  
              Arbeit {% if a is number %}{{ '%.2f'|format(a) | replace('.', ',') }} €{% else %}–{% endif %} · Grund/Fix {% if f is number %}{{ '%.2f'|format(f) | replace('.', ',') }} €{% else %}–{% endif %}


title: Energie & Tarifvergleich
views:
  - title: Übersicht
    path: vergleich
    icon: mdi:view-dashboard-outline
    show_icon_and_title: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Arbeitspreise jetzt
            heading_style: title
          - type: grid
            columns: 5
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preis_heat
                primary: "{% if is_number(states('sensor.tarifvergleich_preis_heat')) %}{{ '%.2f'|format(states('sensor.tarifvergleich_preis_heat')|float) | replace('.', ',') }}{% else %}–{% endif %}"
                secondary: Heat · ct/kWh
                icon: mdi:file-sign
                layout: vertical
                multiline_secondary: true
                tap_action:
                  action: more-info
                icon_color: >
                  {% set ids = state_attr('sensor.tarifvergleich_preise', 'cheapest_current_ids') or [] %}
                  {{ 'green' if ids and 'octopus_heat' in ids else 'cyan' }}
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preis_dynamisch
                primary: "{% if is_number(states('sensor.tarifvergleich_preis_dynamisch')) %}{{ '%.2f'|format(states('sensor.tarifvergleich_preis_dynamisch')|float) | replace('.', ',') }}{% else %}–{% endif %}"
                secondary: Dynamisch · ct/kWh
                icon: mdi:chart-timeline-variant
                layout: vertical
                multiline_secondary: true
                tap_action:
                  action: more-info
                icon_color: >
                  {% set ids = state_attr('sensor.tarifvergleich_preise', 'cheapest_current_ids') or [] %}
                  {{ 'green' if ids and 'dynamic' in ids else 'indigo' }}
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preis_modul3
                primary: "{% if is_number(states('sensor.tarifvergleich_preis_modul3')) %}{{ '%.2f'|format(states('sensor.tarifvergleich_preis_modul3')|float) | replace('.', ',') }}{% else %}–{% endif %}"
                secondary: Modul 3 · ct/kWh
                icon: mdi:sine-wave
                layout: vertical
                multiline_secondary: true
                tap_action:
                  action: more-info
                icon_color: >
                  {% set ids = state_attr('sensor.tarifvergleich_preise', 'cheapest_current_ids') or [] %}
                  {{ 'green' if ids and 'dynamic_modul3' in ids else 'purple' }}
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preis_loyalty
                primary: "{% if is_number(states('sensor.tarifvergleich_preis_loyalty')) %}{{ '%.2f'|format(states('sensor.tarifvergleich_preis_loyalty')|float) | replace('.', ',') }}{% else %}–{% endif %}"
                secondary: Loyalty · ct/kWh
                icon: mdi:star-outline
                layout: vertical
                multiline_secondary: true
                tap_action:
                  action: more-info
                icon_color: >
                  {% set ids = state_attr('sensor.tarifvergleich_preise', 'cheapest_current_ids') or [] %}
                  {{ 'green' if ids and 'octopus_heat_loyalty' in ids else 'grey' }}
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preis_fix
                primary: "{% if is_number(states('sensor.tarifvergleich_preis_fix')) %}{{ '%.2f'|format(states('sensor.tarifvergleich_preis_fix')|float) | replace('.', ',') }}{% else %}–{% endif %}"
                secondary: Fix · ct/kWh
                icon: mdi:lock-outline
                layout: vertical
                multiline_secondary: true
                tap_action:
                  action: more-info
                icon_color: >
                  {% set ids = state_attr('sensor.tarifvergleich_preise', 'cheapest_current_ids') or [] %}
                  {{ 'green' if ids and 'fix_tarif' in ids else 'grey' }}
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:swap-horizontal
                content: >
                  {% set spot = states('sensor.nord_pool_ger_aktueller_preis') %}
                  {% if is_number(spot) %}Spot {{ '%.2f'|format(spot|float * 100) | replace('.', ',') }} ct{% else %}Spot –{% endif %}
              - type: template
                icon: mdi:weather-night
                icon_color: >
                  {% set slot = state_attr('sensor.tarifvergleich_preise', 'modul3_slot') %}
                  {{ 'green' if slot == 'nt' else 'red' if slot == 'ht' else 'amber' }}
                content: >
                  {% set slot = state_attr('sensor.tarifvergleich_preise', 'modul3_slot') %}
                  {% if slot == 'nt' %}NT 00–07
                  {% elif slot == 'ht' %}HT 15–20
                  {% elif slot == 'st' %}ST 07–15 / 20–24
                  {% else %}Modul 3 –{% endif %}
              - type: template
                icon: mdi:flash
                content: >
                  {% set q = states('sensor.tarifvergleich_viertelstunde_kwh') %}
                  {% if is_number(q) %}{{ '%.2f'|format(q|float) | replace('.', ',') }} kWh / 15 min{% else %}15 min –{% endif %}
              - type: template
                icon: mdi:traffic-light
                icon_color: >
                  {% set p = state_attr('sensor.tarifvergleich_heute', 'hit_share_octopus_heat') %}
                  {{ 'green' if p is number and p >= 0.40 else 'amber' if p is number and p >= 0.25 else 'red' if p is number else 'grey' }}
                content: >
                  {% set h = state_attr('sensor.tarifvergleich_heute', 'hit_share_octopus_heat') %}
                  {% set d = state_attr('sensor.tarifvergleich_heute', 'hit_share_dynamic') %}
                  {% set m = state_attr('sensor.tarifvergleich_heute', 'hit_share_dynamic_modul3') %}
                  Heat {% if h is number %}{{ (h*100)|round(0)|int }} %{% else %}–{% endif %}
                  · Dyn {% if d is number %}{{ (d*100)|round(0)|int }} %{% else %}–{% endif %}
                  · M3 {% if m is number %}{{ (m*100)|round(0)|int }} %{% else %}–{% endif %}
          - type: markdown
            content: >
              Große Zahl = Arbeitspreis jetzt. Grün = günstigster Slot.
              Ampel = Anteil der heutigen kWh in günstigen Fenstern (Heat NT 02–06/12–16).
              {% set err = state_attr('sensor.tarifvergleich_preise', 'collector_error') %}
              {% if err %} **Collector:** {{ err }}{% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Wann einschalten
            heading_style: title
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_preise
            primary: "{{ state_attr('sensor.tarifvergleich_preise', 'heat_span') or '–' }}"
            secondary: >
              {% set w = state_attr('sensor.tarifvergleich_preise', 'heat_when') %}
              Heat NT 02–06 / 12–16{% if w %} · {{ w }}{% endif %}
            icon: mdi:clock-outline
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_color: cyan
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_preise
            primary: "{{ state_attr('sensor.tarifvergleich_preise', 'run_dynamic_2h') or '–' }}"
            secondary: >
              {% set w = state_attr('sensor.tarifvergleich_preise', 'run_dynamic_2h_when') %}
              {% set c = state_attr('sensor.tarifvergleich_preise', 'run_dynamic_2h_ct') %}
              Dynamisch 2 h{% if w %} · {{ w }}{% endif %}{% if c is number %} · {{ '%.1f'|format(c) | replace('.', ',') }} ct{% endif %}
            icon: mdi:dishwasher
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_color: indigo
          - type: custom:mushroom-template-card
            entity: sensor.tarifvergleich_preise
            primary: "{{ state_attr('sensor.tarifvergleich_preise', 'run_modul3_2h') or '–' }}"
            secondary: >
              {% set w = state_attr('sensor.tarifvergleich_preise', 'run_modul3_2h_when') %}
              {% set c = state_attr('sensor.tarifvergleich_preise', 'run_modul3_2h_ct') %}
              Modul 3 2 h{% if w %} · {{ w }}{% endif %}{% if c is number %} · {{ '%.1f'|format(c) | replace('.', ',') }} ct{% endif %}
            icon: mdi:washing-machine
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_color: purple
          - type: markdown
            content: >
              {% set e = 'sensor.tarifvergleich_preise' %}
              1 h Dyn {{ state_attr(e, 'run_dynamic_1h_when') }} {{ state_attr(e, 'run_dynamic_1h') or '–' }}
              · M3 {{ state_attr(e, 'run_modul3_1h_when') }} {{ state_attr(e, 'run_modul3_1h') or '–' }}.
              Nur Anzeige.

      - type: grid
        cards:
          - type: heading
            heading: Haus
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Anker Solix
            secondary: >
              {% set pv = states('sensor.anker_solix_solarbank_4_e5000_pro_211_solarstrom') %}
              {% set load = states('sensor.anker_solix_solarbank_4_e5000_pro_211_startseite_last') %}
              {% set soc = states('sensor.anker_solix_solarbank_4_e5000_pro_211_soc') %}
              {% if pv in ['unknown', 'unavailable'] and load in ['unknown', 'unavailable'] %}keine Daten
              {% else %}PV {% if is_number(pv) %}{{ pv|float|round(0)|int }} W{% else %}–{% endif %}
              · Last {% if is_number(load) %}{{ load|float|round(0)|int }} W{% else %}–{% endif %}
              · SOC {% if is_number(soc) %}{{ soc|float|round(0)|int }} %{% else %}–{% endif %}{% endif %}
            icon: mdi:solar-power-variant
            multiline_secondary: true
            icon_color: >
              {% set pv = states('sensor.anker_solix_solarbank_4_e5000_pro_211_solarstrom') %}
              {{ 'amber' if is_number(pv) and pv|float >= 50 else 'grey' }}
            tap_action:
              action: more-info
            entity: sensor.anker_solix_solarbank_4_e5000_pro_211_soc
          - type: custom:mushroom-template-card
            entity: sensor.tesla_wall_connector_status
            primary: >
              {% set st = states('sensor.tesla_wall_connector_status') %}
              {% set labels = {
                'charging': 'Wallbox lädt',
                'charging_finished': 'Ladevorgang fertig',
                'connected': 'Fahrzeug verbunden',
                'not_connected': 'Kein Fahrzeug',
                'ready': 'Wallbox bereit',
                'waiting_car': 'Wartet auf Auto',
                'charging_reduced': 'Laden reduziert',
                'negotiating': 'Handshake',
                'booting': 'Startet',
                'error': 'Wallbox-Fehler'
              } %}
              {{ labels[st] if st in labels else 'Wallbox' }}
            secondary: >
              {% set p = states('sensor.tesla_wall_connector_gesamtleistung') %}
              {% set w = states('sensor.tarifvergleich_wallbox') %}
              {% if is_number(p) %}{{ '%.2f'|format(p|float) | replace('.', ',') }} kW{% else %}– kW{% endif %}
              · heute {% if is_number(w) %}{{ '%.2f'|format(w|float) | replace('.', ',') }}{% else %}–{% endif %} kWh
            icon: mdi:ev-station
            multiline_secondary: true
            icon_color: >
              {% set st = states('sensor.tesla_wall_connector_status') %}
              {{ 'green' if st in ['charging', 'charging_reduced'] else 'red' if st == 'error' else 'grey' }}
            tap_action:
              action: more-info
          - type: markdown
            content: Anker und Wallbox nur Anzeige. Abrechnung = Netzbezug.

      - type: grid
        cards:
          - type: heading
            heading: Netzbezug 24 h
            heading_style: title
          - type: custom:mini-graph-card
            name: 15-Minuten-kWh
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            animate: false
            hour24: true
            decimals: 3
            font_size: 75
            smoothing: false
            color: '#ff9800'
            show:
              labels: true
              extrema: true
              fill: fade
            entities:
              - entity: sensor.tarifvergleich_viertelstunde_kwh
                name: kWh
                color: '#ff9800'

      - type: grid
        cards:
          - type: heading
            heading: Dynamisch / Modul 3
            heading_style: title
          - type: custom:mini-graph-card
            name: Arbeitspreis brutto
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            animate: false
            hour24: true
            decimals: 1
            font_size: 75
            smoothing: false
            aggregate_func: last
            show:
              labels: true
              extrema: true
              fill: fade
              legend: true
            entities:
              - entity: sensor.tarifvergleich_dynamisch_ct
                name: Dynamisch
                color: '#3f51b5'
              - entity: sensor.tarifvergleich_modul3_ct
                name: + Modul 3
                color: '#9c27b0'
          - type: markdown
            content: >
              {% set hint = state_attr('sensor.tarifvergleich_preise', 'modul3_hint') %}
              {{ hint or 'Modul 3: NT 00–07 günstiger, HT 15–20 teurer.' }}

      - type: grid
        cards:
          - type: heading
            heading: Heute
            heading_style: title
            badges:
              - type: entity
                entity: sensor.tarifvergleich_heute
                color: amber
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:trophy
                icon_color: >
                  {{ 'green' if state_attr('sensor.tarifvergleich_heute', 'ranking_complete') else 'grey' }}
                content: >
                  {% set e = 'sensor.tarifvergleich_heute' %}
                  {% if not state_attr(e, 'ranking_complete') %}
                  kein Vergleich · unvollständig (inkl. laufendem Tag)
                  {% else %}
                  {% set ns = namespace(name='–', val=none) %}
                  {% for n,c in [
                    ('Heat', state_attr(e, 'cost_octopus_heat')),
                    ('Loyalty', state_attr(e, 'cost_octopus_heat_loyalty')),
                    ('Fixer Tarif', state_attr(e, 'cost_fix_tarif')),
                    ('Dynamisch', state_attr(e, 'cost_dynamic')),
                    ('Modul 3', state_attr(e, 'cost_dynamic_modul3'))
                  ] %}
                    {% if c is number and (ns.val is none or c < ns.val) %}
                      {% set ns.name = n %}
                      {% set ns.val = c %}
                    {% endif %}
                  {% endfor %}
                  {% set heat = state_attr(e, 'cost_octopus_heat') %}
                  {% if ns.val is number %}Gesamt {{ ns.name }} {{ '%.2f'|format(ns.val) | replace('.', ',') }} €{% if heat is number and ns.name != 'Heat' %} · {{ '%+.2f'|format(ns.val - heat) | replace('.', ',') }} € vs Heat{% endif %}{% else %}noch kein Vergleich{% endif %}
                  {% endif %}
          - type: markdown
            content: |
              {% macro n(v, d=2) -%}
              {%- if v is number -%}{{ (('%.' ~ d ~ 'f')|format(v)) | replace('.', ',') }}{%- else -%}–{%- endif -%}
              {%- endmacro %}
              {% set e = 'sensor.tarifvergleich_heute' %}
              {% set s = states(e) %}
              {% if s in ['unknown', 'unavailable'] %}
              Noch keine Tagesdaten.
              {% else %}
              {% set due = state_attr(e, 'intervals_due') %}
              {% set ok = state_attr(e, 'intervals_ok') %}
              {% set missing = state_attr(e, 'intervals_missing') %}
              **{{ '%.2f'|format(s|float(0)) | replace('.', ',') }} kWh**{% if ok is number and due is number %} · {{ ok }}/{{ due }}{% if missing %} · {{ missing }} fehlend{% endif %}{% endif %}

              | Tarif | Gesamt | vs Heat |
              |:--|--:|--:|
              | **Heat** | {{ n(state_attr(e, 'cost_octopus_heat')) }} € | Referenz |
              | **Loyalty** | {{ n(state_attr(e, 'cost_octopus_heat_loyalty')) }} € | {{ n(state_attr(e, 'delta_vs_heat_octopus_heat_loyalty')) }} € |
              | **Fixer Tarif** | {{ n(state_attr(e, 'cost_fix_tarif')) }} € | {{ n(state_attr(e, 'delta_vs_heat_fix_tarif')) }} € |
              | **Dynamisch** | {{ n(state_attr(e, 'cost_dynamic')) }} € | {{ n(state_attr(e, 'delta_vs_heat_dynamic')) }} € |
              | **+ Modul 3** | {{ n(state_attr(e, 'cost_dynamic_modul3')) }} € | {{ n(state_attr(e, 'delta_vs_heat_dynamic_modul3')) }} € |

              Perfect nach Tagesende. Aufteilung Arbeit/Grund/§14a im Tab **Details**.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Gestern
            heading_style: title
            badges:
              - type: entity
                entity: sensor.tarifvergleich_gestern
                color: amber
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:trophy
                icon_color: >
                  {{ 'green' if state_attr('sensor.tarifvergleich_gestern', 'ranking_complete') else 'grey' }}
                content: >
                  {% set e = 'sensor.tarifvergleich_gestern' %}
                  {% if not state_attr(e, 'ranking_complete') %}
                  kein Vergleich · unvollständig
                  {% else %}
                  {% set ns = namespace(name='–', val=none) %}
                  {% for n,c in [
                    ('Heat', state_attr(e, 'cost_octopus_heat')),
                    ('Loyalty', state_attr(e, 'cost_octopus_heat_loyalty')),
                    ('Fixer Tarif', state_attr(e, 'cost_fix_tarif')),
                    ('Dynamisch', state_attr(e, 'cost_dynamic')),
                    ('Modul 3', state_attr(e, 'cost_dynamic_modul3'))
                  ] %}
                    {% if c is number and (ns.val is none or c < ns.val) %}
                      {% set ns.name = n %}
                      {% set ns.val = c %}
                    {% endif %}
                  {% endfor %}
                  {% set heat = state_attr(e, 'cost_octopus_heat') %}
                  {% if ns.val is number %}Gesamt {{ ns.name }} {{ '%.2f'|format(ns.val) | replace('.', ',') }} €{% if heat is number and ns.name != 'Heat' %} · {{ '%+.2f'|format(ns.val - heat) | replace('.', ',') }} € vs Heat{% endif %}{% else %}kein Vergleich{% endif %}
                  {% endif %}
          - type: markdown
            content: |
              {% macro n(v, d=2) -%}
              {%- if v is number -%}{{ (('%.' ~ d ~ 'f')|format(v)) | replace('.', ',') }}{%- else -%}–{%- endif -%}
              {%- endmacro %}
              {% set e = 'sensor.tarifvergleich_gestern' %}
              {% set s = states(e) %}
              {% if s in ['unknown', 'unavailable'] %}
              Gestern wird nach Tagesende berechnet.
              {% else %}
              {% set ok = state_attr(e, 'intervals_ok') %}
              {% set due = state_attr(e, 'intervals_due') %}
              **{{ '%.2f'|format(s|float(0)) | replace('.', ',') }} kWh**{% if ok is number and due is number %} · {{ ok }}/{{ due }}{% endif %}

              | Tarif | Gesamt | vs Heat |
              |:--|--:|--:|
              | **Heat** | {{ n(state_attr(e, 'cost_octopus_heat')) }} € | Referenz |
              | **Loyalty** | {{ n(state_attr(e, 'cost_octopus_heat_loyalty')) }} € | {{ n(state_attr(e, 'delta_vs_heat_octopus_heat_loyalty')) }} € |
              | **Fixer Tarif** | {{ n(state_attr(e, 'cost_fix_tarif')) }} € | {{ n(state_attr(e, 'delta_vs_heat_fix_tarif')) }} € |
              | **Dynamisch** | {{ n(state_attr(e, 'cost_dynamic')) }} € | {{ n(state_attr(e, 'delta_vs_heat_dynamic')) }} € |
              | **+ Modul 3** | {{ n(state_attr(e, 'cost_dynamic_modul3')) }} € | {{ n(state_attr(e, 'delta_vs_heat_dynamic_modul3')) }} € |

              {% set pd = state_attr(e, 'perfect_days') %}
              {% if pd is number and pd|int(0) > 0 %}
              {% set pf = state_attr(e, 'cost_dynamic_flat_perfect') %}
              {% set pm = state_attr(e, 'cost_dynamic_perfect') %}
              {% set pfp = state_attr(e, 'potential_dynamic_eur') %}
              {% set pmp = state_attr(e, 'potential_eur') %}
              **Perfect** (theoretische Untergrenze): Dynamisch {{ n(pf) }} € · Potenzial {{ n(pfp) }} € · Modul 3 {{ n(pm) }} € · Potenzial {{ n(pmp) }} €
              {% endif %}
              {% endif %}

  - title: Preise
    path: preise
    icon: mdi:chart-line
    show_icon_and_title: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Heute · Preise
            heading_style: title
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.nord_pool_ger_aktueller_preis
                primary: >
                  {% set s = states('sensor.nord_pool_ger_aktueller_preis') %}
                  {% if is_number(s) %}{{ '%.2f'|format(s|float * 100) | replace('.', ',') }}{% else %}–{% endif %}
                secondary: Spot · ct netto
                icon: mdi:chart-line
                layout: vertical
                multiline_secondary: true
                icon_color: blue
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preise
                primary: "{{ state_attr('sensor.tarifvergleich_preise', 'today_cheapest_ct') or '–' }}"
                secondary: >
                  {% set s = state_attr('sensor.tarifvergleich_preise', 'today_cheapest_span') %}
                  Günstigster Slot{% if s %} · {{ s }}{% endif %}
                icon: mdi:arrow-down-bold
                layout: vertical
                multiline_secondary: true
                icon_color: green
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preise
                primary: "{{ state_attr('sensor.tarifvergleich_preise', 'today_peak_ct') or '–' }}"
                secondary: >
                  {% set s = state_attr('sensor.tarifvergleich_preise', 'today_peak_span') %}
                  Peak heute{% if s %} · {{ s }}{% endif %}
                icon: mdi:arrow-up-bold
                layout: vertical
                multiline_secondary: true
                icon_color: red
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.tarifvergleich_preise
                primary: >
                  {% set d = state_attr('sensor.tarifvergleich_preise', 'modul3_nt_delta_net_ct') %}
                  {% if d is number %}{{ '%+.2f'|format(d) | replace('.', ',') }}{% else %}–{% endif %}
                secondary: NT vs Flach · ct netto
                icon: mdi:weather-night
                layout: vertical
                multiline_secondary: true
                icon_color: purple
                tap_action:
                  action: more-info
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:weather-night
                icon_color: green
                content: NT 00–07 · 0,95 ct
              - type: template
                icon: mdi:minus
                icon_color: >
                  {% set slot = state_attr('sensor.tarifvergleich_preise', 'modul3_slot') %}
                  {{ 'amber' if slot == 'st' else 'grey' }}
                content: ST 07–15 / 20–24 · 9,53 ct
              - type: template
                icon: mdi:weather-sunny
                icon_color: >
                  {% set slot = state_attr('sensor.tarifvergleich_preise', 'modul3_slot') %}
                  {{ 'red' if slot == 'ht' else 'grey' }}
                content: HT 15–20 · 15,65 ct
          - type: markdown
            content: >
              Woche = Recorder ab Sensorstart. Monat/Jahr = Statistik, Modul 3 erst ab 23.08. 10:03.
      - type: grid
        cards:
          - type: heading
            heading: Woche · bis zu 7 Tage
            heading_style: title
          - type: custom:mini-graph-card
            name: 7 Tage · ct/kWh
            hours_to_show: 168
            points_per_hour: 4
            line_width: 2
            animate: false
            hour24: true
            decimals: 1
            font_size: 75
            smoothing: false
            aggregate_func: last
            show:
              labels: true
              extrema: true
              fill: fade
              legend: true
            entities:
              - entity: sensor.tarifvergleich_dynamisch_ct
                name: Dynamisch
                color: '#3f51b5'
              - entity: sensor.tarifvergleich_modul3_ct
                name: + Modul 3
                color: '#9c27b0'
      - type: grid
        cards:
          - type: heading
